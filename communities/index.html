<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Наша сеть — Paranoid DAO</title>
  <meta name="description" content="Комьюнити Paranoid DAO: Telegram, Twitter/X и YouTube каналы крипто и AI тематики, с которыми работает агентство.">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://paranoidao.xyz/communities/">
  <link rel="stylesheet" href="../style.css?v=15">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="icon" type="image/png" sizes="64x64" href="../favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
</head>
<body>

  <header class="header">
    <div class="container header__inner">
      <a href="../" class="logo">PARANOID<span>DAO</span></a>
      <div class="header__actions">
        <a href="../" class="btn btn--small btn--ghost">← На главную</a>
      </div>
    </div>
  </header>

  <section class="page-hero">
    <div class="container">
      <p class="section__label">// сеть агентства</p>
      <h1 class="page-hero__title">Наша сеть<br>комьюнити.</h1>
    </div>
  </section>

  <section class="section">
    <div class="container" style="text-align:center; padding: 60px 0 100px;">
      <p class="section__label">// статус</p>
      <h2 class="section__title" style="margin-bottom: 24px;">Раздел в разработке.</h2>
      <p style="color: var(--text-dim); font-size: 17px; max-width: 480px; margin: 0 auto;">
        Мы собираем и проверяем список из 250+ крипто и AI-комьюнити.
        Скоро здесь появятся каналы по Telegram, X и YouTube.
      </p>
      <div style="margin-top: 40px;">
        <a href="https://t.me/paranoidao" target="_blank" rel="noopener" class="btn">Telegram</a>
      </div>
    </div>
  </section>

  <!--
  ЗАГОТОВКА СПИСКА КАНАЛОВ (вернуть когда раздел откроем):

  <div class="channels__group">
    <p class="channels__platform">/ Telegram</p>
    <h3>250+ каналов и чатов</h3>
    <div class="channel-list">
      <a class="channel-row" href="https://t.me/paranoidao" target="_blank" rel="noopener">
        <span class="channel-row__name">@paranoidao</span>
        <span class="channel-row__niche">наш канал</span>
        <span class="channel-row__subs">—</span>
        <span class="channel-row__arrow">→</span>
      </a>
      ... остальное по аналогии: name / niche / subs / →
    </div>
  </div>

  Формат строки:
  <a class="channel-row" href="ССЫЛКА" target="_blank" rel="noopener">
    <span class="channel-row__name">@handle</span>
    <span class="channel-row__niche">тема</span>
    <span class="channel-row__subs">подписчики</span>
    <span class="channel-row__arrow">→</span>
  </a>
  -->

  <script>
  // Кастомный курсор.
  if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
    const dot = document.createElement('div');
    const ring = document.createElement('div');
    dot.className = 'cursor cursor-dot';
    ring.className = 'cursor cursor-ring';
    document.body.appendChild(dot);
    document.body.appendChild(ring);
    let mx = -100, my = -100, rx = -100, ry = -100;
    document.addEventListener('mousemove', e => {
      mx = e.clientX; my = e.clientY;
      dot.style.transform = 'translate(' + (mx - 3) + 'px,' + (my - 3) + 'px)';
    }, { passive: true });
    const loopCursor = () => {
      rx += (mx - rx) * 0.18;
      ry += (my - ry) * 0.18;
      ring.style.transform = 'translate(' + (rx - 17) + 'px,' + (ry - 17) + 'px)';
      requestAnimationFrame(loopCursor);
    };
    loopCursor();
    document.addEventListener('mouseover', e => {
      ring.classList.toggle('is-hover', !!e.target.closest('a, button'));
    });
  }
  </script>
</body>
</html>
