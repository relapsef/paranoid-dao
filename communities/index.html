<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Наша сеть — Paranoid DAO</title>
  <meta name="description" content="Комьюнити Paranoid DAO: Telegram, Twitter/X и YouTube каналы крипто и AI тематики, с которыми работает агентство.">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://paranoidao.xyz/communities/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Anton&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css?v=88">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="icon" type="image/png" sizes="64x64" href="../favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
</head>
<body>

  <header class="header">
    <div class="container header__inner">
      <a href="../" class="logo"><img src="../paranoid-logo.png" alt="" class="logo__img">PARANOID<span>DAO</span></a>
      <div class="header__actions">
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme">
          <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
          <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        </button>
        <div class="lang">
          <button class="lang-toggle" id="langToggle" type="button">RU</button>
          <div class="lang-menu" id="langMenu">
            <button type="button" data-lang-opt="ru">RU</button>
            <button type="button" data-lang-opt="en">EN</button>
            <button type="button" data-lang-opt="uk">UA</button>
          </div>
        </div>
        <a href="../" class="btn btn--small btn--ghost" data-i18n="nav.home">← На главную</a>
      </div>
    </div>
  </header>

  <section class="page-hero">
    <div class="container">
      <p class="section__label" data-i18n="net.label">// сеть агентства</p>
      <h1 class="page-hero__title" data-i18n-html="net.title">Наша сеть<br>комьюнити.</h1>
    </div>
  </section>

  <section class="section" style="padding-top: 56px;">
    <div class="container">
      <p class="section__label" data-i18n="net.gridLabel">// примеры сообществ</p>
      <div class="channels__grid" id="channelsGrid"></div>
      <p class="channels__note" data-i18n="net.note">Полная база 300+ крипто и AI комьюнити. Список каналов по запросу в лс.</p>
      <div style="text-align:center; margin-top: 56px;">
        <a href="https://t.me/relapseqq" target="_blank" rel="noopener" class="btn" data-i18n="net.btn">Запросить список каналов</a>
      </div>
    </div>
  </section>

  <!--
  ЗАГОТОВКА СПИСКА КАНАЛОВ (вернуть когда раздел откроем):

  <div class="channels__group">
    <p class="channels__platform">/ Telegram</p>
    <h3>300+ каналов и чатов</h3>
    <div class="channel-list">
      <a class="channel-row" href="https://t.me/paranoiddao_mirror" target="_blank" rel="noopener">
        <span class="channel-row__name">@paranoiddao_mirror</span>
        <span class="channel-row__niche">наш канал</span>
        <span class="channel-row__subs">—</span>
        <span class="channel-row__arrow">→</span>
      </a>
      ... остальное по аналогии: name / niche / subs / →
    </div>
  </div>

  Формат строки:
  <a class="channel-row" href="ССЫЛКА" target="_blank" rel="noopener">
    <span class="channel-row__name">@handle</span>
    <span class="channel-row__niche">тема</span>
    <span class="channel-row__subs">подписчики</span>
    <span class="channel-row__arrow">→</span>
  </a>
  -->

<script>
  // Тема + язык (общие ключи localStorage с главной страницей).
  const EN = {
    "nav.home": "← Home",
    "net.label": "// agency network",
    "net.title": "Our community<br>network.",
    "net.status": "// status",
    "net.soon": "Coming soon.",
    "net.text": "We're compiling and verifying a list of 300+ crypto and AI communities. Telegram, X and YouTube channels will appear here soon.",
    "net.gridLabel": "// community examples",
    "net.note": "Full base of 300+ crypto and AI communities. Channel list on request via DM.",
    "net.btn": "Request the channel list",
    "net.subs": "subs",
    "net.reach": "avg reach",
    "chan1.niche": "airdrops + original posts",
    "chan2.niche": "exchange promos & alpha calls",
    "chan3.name": "Mamkin Kriptan",
    "chan3.niche": "exchange earnings, promos, banks",
    "chan4.niche": "trading & token analytics"
  };

  const UK = {
    "nav.home": "← На головну",
    "net.label": "// мережа агентства",
    "net.title": "Наша мережа<br>ком'юніті.",
    "net.status": "// статус",
    "net.soon": "Розділ у розробці.",
    "net.text": "Ми збираємо та перевіряємо список із 300+ крипто- та AI-ком'юніті. Незабаром тут з'являться канали в Telegram, X та YouTube.",
    "net.gridLabel": "// приклади ком'юніті",
    "net.note": "Повна база 300+ крипто та AI ком'юніті. Список каналів на запит у лс.",
    "net.btn": "Запросити список каналів",
    "net.subs": "підписників",
    "net.reach": "сер. охоплення",
    "chan1.niche": "аірдропи + авторські пости",
    "chan2.niche": "промки бірж і темки",
    "chan3.name": "Мамкін Криптан",
    "chan3.niche": "заробіток на біржах, промо, банки",
    "chan4.niche": "трейдинг і аналітика токенів"
  };

  const themeToggle = document.getElementById('themeToggle');
  function applyTheme(t) {
    if (t === 'light') document.documentElement.dataset.theme = 'light';
    else delete document.documentElement.dataset.theme;
    try { localStorage.setItem('theme', t); } catch (e) {}
  }
  let savedTheme = 'dark';
  try { savedTheme = localStorage.getItem('theme') || 'dark'; } catch (e) {}
  applyTheme(savedTheme);
  if (themeToggle) {
    themeToggle.addEventListener('click', () => {
      applyTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
    });
  }

  // Каналы сети: карточки рендерятся из массива. Новый канал = одна строка.
  const CHANNELS = [
    { name: 'Gem Research', avatar: '../gem_research.jpg', url: 'https://t.me/gemresearch',
      niche: 'аирдропы + авторские посты', nicheKey: 'chan1.niche',
      subs: '30K', reach: '3K', platform: 'Telegram' },
    { name: 'Темщики CRYPTO', avatar: '../temchik.jpg', url: 'https://t.me/+uBkKPhFqDSMyZmNi',
      niche: 'промки бирж и темки', nicheKey: 'chan2.niche',
      subs: '41K', reach: '4K', platform: 'Telegram' },
    { name: 'Мамкин Криптан', nameKey: 'chan3.name', avatar: '../mk_crypto.jpg', url: 'https://t.me/Crypto_Cyodaaaa',
      niche: 'заработок на биржах, промо, банки', nicheKey: 'chan3.niche',
      subs: '22K', reach: '2K', platform: 'Telegram' },
    { name: 'Crypto Profit Club', avatar: '../prft_club.jpg', url: 'https://t.me/NikTradingClub',
      niche: 'трейдинг и аналитика токенов', nicheKey: 'chan4.niche',
      subs: '48K', reach: '6K', platform: 'Telegram' }
  ];
  (function renderChannels() {
    const grid = document.getElementById('channelsGrid');
    if (!grid) return;
    CHANNELS.forEach(c => {
      const card = document.createElement('a');
      card.className = 'channel-card';
      card.href = c.url;
      card.target = '_blank';
      card.rel = 'noopener noreferrer';
      const top = document.createElement('div');
      top.className = 'channel-card__top';
      const img = document.createElement('img');
      img.className = 'channel-card__ava';
      img.src = c.avatar; img.alt = c.name; img.loading = 'lazy';
      const info = document.createElement('div');
      const name = document.createElement('span');
      name.className = 'channel-card__name';
      name.textContent = c.name;
      if (c.nameKey) name.setAttribute('data-i18n', c.nameKey);
      const niche = document.createElement('span');
      niche.className = 'channel-card__niche';
      niche.textContent = c.niche;
      niche.setAttribute('data-i18n', c.nicheKey);
      info.append(name, niche);
      top.append(img, info);
      const stats = document.createElement('div');
      stats.className = 'channel-card__stats';
      const s1 = document.createElement('span');
      s1.innerHTML = '<b></b> <i data-i18n="net.subs">подписчиков</i>';
      s1.querySelector('b').textContent = c.subs;
      const s2 = document.createElement('span');
      s2.innerHTML = '<b></b> <i data-i18n="net.reach">ср. охват</i>';
      s2.querySelector('b').textContent = c.reach;
      stats.append(s1, s2);
      card.append(top, stats);
      grid.appendChild(card);
    });
  })();

  const i18nEls = [...document.querySelectorAll('[data-i18n], [data-i18n-html]')];
  const original = new Map(i18nEls.map(el => {
    const entries = [];
    if (el.hasAttribute('data-i18n')) entries.push(['data-i18n', el.textContent]);
    if (el.hasAttribute('data-i18n-html')) entries.push(['data-i18n-html', el.innerHTML]);
    return [el, entries];
  }));

  const langToggle = document.getElementById('langToggle');
  const langMenu = document.getElementById('langMenu');
  const DICTS = { en: EN, uk: UK };

  function setLang(lang) {
    document.documentElement.lang = lang;
    try { localStorage.setItem('lang', lang); } catch (e) {}
    if (langToggle) langToggle.textContent = { ru: 'RU', en: 'EN', uk: 'UA' }[lang] || lang.toUpperCase();
    if (langMenu) langMenu.querySelectorAll('[data-lang-opt]').forEach(b => {
      b.classList.toggle('active', b.dataset.langOpt === lang);
    });
    for (const [el, entries] of original) {
      for (const [attr, ruText] of entries) {
        const key = el.getAttribute(attr);
        const value = lang === 'ru' ? ruText : (DICTS[lang] && DICTS[lang][key]);
        if (value === undefined) continue;
        if (attr === 'data-i18n') el.textContent = value;
        else el.innerHTML = value;
      }
    }
  }
  let savedLang = null;
  try { savedLang = localStorage.getItem('lang'); } catch (e) {}
  if (!savedLang) {
    const nav = (navigator.language || '').toLowerCase();
    savedLang = nav.startsWith('uk') ? 'uk' : nav.startsWith('ru') ? 'ru' : 'en';
  }
  setLang(savedLang);
  if (langToggle && langMenu) {
    langToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      langMenu.classList.toggle('open');
    });
    langMenu.querySelectorAll('[data-lang-opt]').forEach(btn => {
      btn.addEventListener('click', () => {
        setLang(btn.dataset.langOpt);
        langMenu.classList.remove('open');
      });
    });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.lang')) langMenu.classList.remove('open');
    });
  }
</script>
